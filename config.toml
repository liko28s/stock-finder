[universe]
tickers = ["AAPL", "MSFT", "NVDA", "AMZN", "GOOGL", "META", "JPM", "XOM", "INTC", "GOOG", "SMTC", "QBTS", "TSLA", "AMD", "JBLU", "PLTR", "GOLD", "GC=F", "GLD"]  # Yahoo has no constituents API
screens = ["most_actives", "day_gainers", "day_losers"]  # Yahoo predefined screens to discover extra candidates; [] disables
max_tickers = 120           # cap on total scanned (config + discovered), API politeness

[thresholds]
rsi_oversold = 30
rsi_overbought = 70
max_picks = 15         # only the most relevant N screened picks per scan get an AI call
move_pct = 5.0         # |1-day move| that flags a momentum pick (needs volume_ratio too); remove to disable
volume_ratio = 1.5     # today's volume / 20d avg
max_downtrend_adx = 25 # skip oversold pre-bull picks when adx is above this and -DI > +DI (falling knife); remove to disable
ttl_seconds = 900      # max age of fetched data (V1)

[ai]
backend = "openrouter" # or "ollama"
openrouter_model = "nvidia/nemotron-3-ultra-550b-a55b:free"  # tried first
openrouter_fallbacks = ["poolside/laguna-s-2.1:free", "google/gemma-4-31b-it:free", "google/gemma-4-26b-a4b-it:free"]  # explicit models tried next
auto_free_models = true     # then roll over to any other free OpenRouter model
max_model_tries = 4         # models tried per pick (60s timeout each); sticks to the last winner
ollama_model = "openbmb/minicpm5"
ollama_url = "http://localhost:11434"

[feedback]
review_after_days = 5  # remind on unresolved alerts after this many days (react 👍 TP hit / 👎 SL hit)

[alerts]
chart_links = true  # add a QuickChart candlestick (marked at the alert) + TradingView link; sends only public OHLC to quickchart.io

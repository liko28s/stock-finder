[universe]
tickers = ["AAPL", "MSFT", "NVDA", "AMZN", "GOOGL", "META", "JPM", "XOM", "INTC", "GOOG", "SMTC", "QBTS", "TSLA", "AMD", "JBLU"]  # Yahoo has no constituents API
screens = ["most_actives"]  # Yahoo predefined screens to discover extra candidates; [] disables
max_tickers = 60            # cap on total scanned (config + discovered), API politeness

[thresholds]
rsi_oversold = 30
rsi_overbought = 70
volume_ratio = 1.5     # today's volume / 20d avg
ttl_seconds = 900      # max age of fetched data (V1)

[ai]
backend = "openrouter" # or "ollama"
openrouter_model = "nvidia/nemotron-3-ultra-550b-a55b:free"  # tried first
openrouter_fallbacks = []   # optional explicit models tried next
auto_free_models = true     # then roll over to any other free OpenRouter model
max_model_tries = 5         # models tried per pick
ollama_model = "openbmb/minicpm5"
ollama_url = "http://localhost:11434"
